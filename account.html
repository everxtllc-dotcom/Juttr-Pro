<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Juttr</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f1117" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="nav scrolled" id="nav">
  <a href="/" class="nav-logo" aria-label="Juttr">
    <img class="jx-wordmark" src="assets/juttr-wordmark.svg" alt="Juttr" />
  </a>
  <a class="btn btn-ghost btn-sm" href="/">Back to site</a>
</header>

<section class="hero" style="min-height: 100vh; justify-content: center; padding-top: 120px;">
  <div class="hero-glow"></div>
  <div class="hero-inner" style="max-width: 560px;">
    <h1 class="hero-title" style="font-size: clamp(30px, 5vw, 46px);">Log in</h1>
    <p class="hero-sub" style="margin-bottom: 28px;">
      Sign in with your Juttr account email and password to check your subscription.
    </p>

    <!-- Email + password login (Supabase Auth) -->
    <form class="account-box" id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com"
               autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••"
               autocomplete="current-password" required />
      </div>
      <button class="btn btn-accent btn-lg" id="loginBtn" type="submit" style="width: 100%;">
        Log in
      </button>
      <p class="account-error" id="error" hidden></p>
    </form>

    <p class="hero-sub" style="font-size: 13.5px; margin-top: 18px;">
      No account yet? <a href="/#pricing">Get Juttr Pro</a> — your account is created at checkout.
    </p>
    <p class="hero-sub" style="font-size: 13px; margin-top: 10px;">
      <a href="#" id="resetLink">Set or reset your password</a>
    </p>

    <!-- Set password (shown when arriving from a "set your password" email link) -->
    <form class="account-box" id="setPwForm" hidden>
      <div class="field">
        <label for="newPassword">Choose a password</label>
        <input id="newPassword" type="password" placeholder="At least 8 characters"
               autocomplete="new-password" minlength="8" required />
      </div>
      <button class="btn btn-accent btn-lg" id="setPwBtn" type="submit" style="width: 100%;">
        Set password &amp; continue
      </button>
      <p class="account-error" id="setPwError" hidden></p>
    </form>

    <!-- Result (shown after a successful login) -->
    <div class="account-box" id="result" hidden>
      <div class="detail-head"><span class="status-badge" id="statusBadge" hidden>Active</span></div>
      <p class="hero-sub" id="resultMsg" style="margin: 0;"></p>
      <div class="hero-actions" style="justify-content: flex-start; margin-top: 20px;" id="resultActions"></div>
    </div>
  </div>
</section>

<style>
  .account-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; text-align: left;
    max-width: 480px; margin: 0 auto;
  }
  .account-box + .account-box { margin-top: 20px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px;
  }
  .field input {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14.5px;
    color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--teal); }
  .account-error { margin: 12px 0 0; font-size: 13px; color: #fb7185; }
  .detail-head:empty { display: none; }
  .status-badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--teal-bright); background: var(--teal-soft);
    border: 1px solid rgba(45, 212, 191, 0.28); border-radius: 999px; padding: 5px 12px;
    margin-bottom: 14px;
  }
</style>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // ── Public Supabase config (safe to expose in the browser) ──────────────────
  // The anon key is designed to be public; Row Level Security protects your data.
  // Replace both with your project's values (Dashboard → Project Settings → API).
  // The SERVICE ROLE key must NEVER appear here — it stays server-side only.
  const SUPABASE_URL = 'https://ctypqmdlwlssgilusdsf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eXBxbWRsd2xzc2dpbHVzZHNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNzgyOTAsImV4cCI6MjA5ODc1NDI5MH0.rf3HzwknqJTA-Zv_vnsA8dpRxqaXQV1ThXg8edBWe5A';

  // Where verified users are sent. Point this at your app / dashboard URL.
  const DASHBOARD_URL = '/';

  // Fallback when /api/create-portal fails. Reloading /account is harmless (the
  // user can retry) and avoids Stripe's error page. If you'd rather use Stripe's
  // hosted email-login page, set this to your Customer Portal login link from the
  // Stripe Dashboard (Settings → Billing → Customer portal → Login link),
  // e.g. 'https://billing.stripe.com/p/login/xxxxxxxx'. The bare
  // 'https://billing.stripe.com/p/login' is NOT valid and Stripe rejects it.
  const GENERIC_PORTAL = '/account';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('loginForm');
  const emailEl = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const btn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  const badgeEl = document.getElementById('statusBadge');
  const resultMsg = document.getElementById('resultMsg');
  const resultActions = document.getElementById('resultActions');
  const setPwForm = document.getElementById('setPwForm');
  const newPasswordEl = document.getElementById('newPassword');
  const setPwBtn = document.getElementById('setPwBtn');
  const setPwError = document.getElementById('setPwError');
  const resetLink = document.getElementById('resetLink');

  // Prefill the email if a Supabase session is already stored on this device.
  supabase.auth.getSession().then(({ data }) => {
    if (data && data.session && data.session.user && !emailEl.value) {
      emailEl.value = data.session.user.email || '';
    }
  });

  function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
  function setBusy(b) { btn.disabled = b; btn.textContent = b ? 'Signing in…' : 'Log in'; }

  // The billing endpoints require proof that the caller controls the account —
  // an email alone is not a credential. Here that proof is the login session.
  async function sessionToken() {
    try {
      const s = await supabase.auth.getSession();
      return s.data?.session?.access_token || '';
    } catch (e) { return ''; }
  }

  async function openPortal(email) {
    try {
      const r = await fetch('/api/create-portal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, access_token: await sessionToken() }),
      });
      const d = await r.json().catch(() => ({}));
      window.location.href = (r.ok && d.url) ? d.url : GENERIC_PORTAL;
    } catch (e) {
      window.location.href = GENERIC_PORTAL;
    }
  }

  function fmtDate(unix) {
    return new Date(unix * 1000).toLocaleDateString(undefined, {
      year: 'numeric', month: 'long', day: 'numeric',
    });
  }
  function daysLeft(unix) {
    return Math.max(0, Math.ceil((unix * 1000 - Date.now()) / 86400000));
  }
  function continueBtn() {
    return '<a class="btn btn-accent btn-lg" href="' + DASHBOARD_URL + '">Continue to Juttr</a>';
  }

  // Active accounts. Lifetime never expires; Stripe plans (active/trialing) show
  // the interval + how much time is left in the current period, fetched live from
  // Stripe via /api/subscription-status.
  async function showActive(status, email) {
    resultEl.hidden = false;
    badgeEl.hidden = false;
    badgeEl.textContent =
      status === 'trialing' ? 'Trial' :
      status === 'lifetime' ? 'Lifetime' : 'Active';
    resultActions.innerHTML = '';

    if (status === 'lifetime') {
      resultMsg.textContent = 'Lifetime access — your Pro plan never expires.';
      resultActions.innerHTML = continueBtn();
      return;
    }

    resultMsg.textContent = 'Loading your plan details…';
    let msg = 'Your Juttr Pro subscription is active.';
    try {
      const r = await fetch('/api/subscription-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, access_token: await sessionToken() }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.current_period_end) {
        const interval = d.plan && d.plan.interval;               // 'month' | 'year'
        const period = interval === 'year' ? 'yearly' : interval === 'month' ? 'monthly' : 'Pro';
        const left = daysLeft(d.current_period_end);
        msg = 'Juttr Pro (' + period + ') — ' +
          (d.cancel_at_period_end ? 'expires' : 'renews') + ' on ' + fmtDate(d.current_period_end) +
          ' · ' + left + ' day' + (left === 1 ? '' : 's') + ' left.';
      }
    } catch (e) { /* keep the generic active message */ }

    resultMsg.textContent = msg;
    resultActions.innerHTML =
      continueBtn() +
      '<button class="btn btn-ghost btn-lg" id="portalBtn2" type="button">Manage billing</button>';
    const pb = document.getElementById('portalBtn2');
    if (pb) pb.addEventListener('click', function () { openPortal(email); });
  }

  // Logged in, but no Pro (the default 'free' plan, or a lapsed subscription).
  function showInactive(email, status) {
    resultEl.hidden = false;
    badgeEl.hidden = true;
    resultMsg.textContent = (!status || status === 'free' || status === 'none')
      ? 'You’re logged in on the free plan. Upgrade to unlock Juttr Pro.'
      : 'You’re logged in, but your subscription isn’t active. Renew to restore Pro.';
    resultActions.innerHTML =
      '<a class="btn btn-accent btn-lg" href="/#pricing">Upgrade to Pro</a>' +
      '<button class="btn btn-ghost btn-lg" id="portalBtn" type="button">Manage billing</button>';
    document.getElementById('portalBtn').addEventListener('click', function () {
      openPortal(email);
    });
  }

  // Verify subscription status server-side and render the result. Shared by the
  // login flow and the set-password (auto-provisioned account) flow.
  async function verifyAndShow(email) {
    try {
      // /api/check-user requires proof of possession — an email alone no longer
      // returns a licence. Here that proof is the session we just established.
      const sess = await supabase.auth.getSession();
      const accessToken = sess.data?.session?.access_token || '';
      const res = await fetch('/api/check-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, access_token: accessToken }),
      });
      const info = await res.json().catch(() => ({}));
      if (res.ok && info.active) {
        // Show details (incl. time left) with a manual "Continue" button.
        showActive(info.subscription_status, email);
      } else {
        showInactive(email, info.subscription_status);
      }
    } catch (err) {
      showError('Could not verify your subscription. Please try again.');
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    resultEl.hidden = true;

    const email = emailEl.value.trim().toLowerCase();
    const password = passwordEl.value;
    if (!email || !password) return;

    setBusy(true);
    const auth = await supabase.auth.signInWithPassword({ email: email, password: password });
    if (auth.error) {
      setBusy(false);
      showError(auth.error.message || 'Incorrect email or password.');
      return;
    }
    setBusy(false);
    await verifyAndShow(email);
  });

  // Arriving from a "set your password" email link: Supabase parses the token
  // from the URL and fires PASSWORD_RECOVERY. Reveal the set-password form.
  supabase.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY') {
      form.hidden = true;
      resultEl.hidden = true;
      errorEl.hidden = true;
      setPwForm.hidden = false;
    }
  });

  setPwForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    setPwError.hidden = true;
    const pw = newPasswordEl.value;
    if (!pw || pw.length < 8) {
      setPwError.textContent = 'Use at least 8 characters.';
      setPwError.hidden = false;
      return;
    }
    setPwBtn.disabled = true;
    setPwBtn.textContent = 'Saving…';
    const upd = await supabase.auth.updateUser({ password: pw });
    if (upd.error) {
      setPwBtn.disabled = false;
      setPwBtn.textContent = 'Set password & continue';
      setPwError.textContent = upd.error.message || 'Could not set your password.';
      setPwError.hidden = false;
      return;
    }
    // Now authenticated — verify the subscription and show the result.
    const who = await supabase.auth.getUser();
    const email = ((who.data && who.data.user && who.data.user.email) || '').toLowerCase();
    setPwForm.hidden = true;
    await verifyAndShow(email);
  });

  // "Set or reset your password" — email a set-password link to the address typed
  // above (works for both new/auto-provisioned and existing accounts).
  resetLink.addEventListener('click', async function (e) {
    e.preventDefault();
    const email = emailEl.value.trim().toLowerCase();
    if (!email) { showError('Enter your email above first, then click the link.'); return; }
    await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/account',
    });
    errorEl.hidden = true;
    resultEl.hidden = false;
    badgeEl.hidden = true;
    resultMsg.textContent = 'Check your email for a link to set your password.';
    resultActions.innerHTML = '';
  });
</script>

<footer class="legal-foot">
  <a href="/privacy">Privacy Policy</a>
  <a href="/terms">Terms</a>
  <a href="mailto:info@juttr.cc">info@juttr.cc</a>
  <span>© 2026 EverXt, LLC</span>
</footer>

</body>
</html>
