<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Juttr</title>
  <meta name="description" content="Sign in or create your Juttr account to upgrade to Pro and manage your subscription." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Set theme before paint (no flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('juttr-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<nav class="jx-nav">
  <a href="index.html" class="jx-logo"><img src="assets/logo.png" alt="Juttr logo" /> Juttr</a>
</nav>

<main class="jx-auth-main">
  <div class="jx-auth-card">
    <div class="jx-auth-logo"><img src="assets/logo.png" alt="" /> Juttr</div>
    <h1 class="jx-auth-title" id="auth-title">Welcome back</h1>
    <p class="jx-auth-sub" id="auth-sub">Sign in to continue to your account.</p>

    <div class="jx-auth-tabs" role="tablist">
      <button class="jx-auth-tab" id="tab-signin" role="tab" aria-selected="true" type="button">Sign in</button>
      <button class="jx-auth-tab" id="tab-signup" role="tab" aria-selected="false" type="button">Create account</button>
    </div>

    <button class="jx-btn-google" id="google-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.46a5.53 5.53 0 0 1-2.4 3.62v3h3.88c2.27-2.1 3.56-5.18 3.56-8.81z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.72-4.95H1.28v3.1A12 12 0 0 0 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.29A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.57.38-2.29v-3.1H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l4-3.1z"/>
        <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.6 4.6 1.8l3.44-3.44A11.97 11.97 0 0 0 12 0 12 12 0 0 0 1.28 6.61l4 3.1C6.22 6.88 8.87 4.77 12 4.77z"/>
      </svg>
      Continue with Google
    </button>

    <div class="jx-auth-divider">or</div>

    <form id="auth-form" novalidate>
      <div class="jx-auth-field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </div>
      <div class="jx-auth-field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Your password" minlength="8" />
      </div>
      <button class="jx-auth-submit" id="submit-btn" type="submit">Sign in</button>
    </form>

    <div class="jx-auth-links">
      <button type="button" id="forgot-btn">Forgot password?</button>
    </div>

    <p class="jx-auth-msg" id="auth-msg" role="alert" hidden></p>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script type="module">
  import { supabase, isConfigured, getSession, continueAfterAuth } from './js/auth.js';

  const params = new URLSearchParams(location.search);
  const msg = document.getElementById('auth-msg');
  const form = document.getElementById('auth-form');
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');
  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  let mode = 'signin';

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = `jx-auth-msg ${kind}`;
    msg.hidden = false;
  }

  function setMode(next) {
    mode = next;
    const signin = mode === 'signin';
    tabSignin.setAttribute('aria-selected', String(signin));
    tabSignup.setAttribute('aria-selected', String(!signin));
    document.getElementById('auth-title').textContent = signin ? 'Welcome back' : 'Create your account';
    document.getElementById('auth-sub').textContent = signin
      ? 'Sign in to continue to your account.'
      : 'One account for the extension, web app, and Pro.';
    submitBtn.textContent = signin ? 'Sign in' : 'Create account';
    passEl.autocomplete = signin ? 'current-password' : 'new-password';
    msg.hidden = true;
  }
  tabSignin.addEventListener('click', () => setMode('signin'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  if (params.get('intent') === 'upgrade') {
    document.getElementById('auth-sub').textContent =
      'Sign in or create an account to upgrade to Pro.';
  }

  if (!isConfigured) {
    showMsg('Sign-in is not configured yet. Please check back soon.', 'err');
  } else {
    // Already signed in (or arriving back from the Google redirect)?
    // supabase-js parses the callback automatically; continue the journey.
    getSession().then((session) => {
      if (session) continueAfterAuth(params);
    });
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN') continueAfterAuth(params);
    });
  }

  document.getElementById('google-btn').addEventListener('click', async () => {
    if (!isConfigured) return;
    const redirectTo = `${location.origin}/login.html${location.search}`;
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo },
    });
    if (error) showMsg(error.message, 'err');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!isConfigured) return;
    const email = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) return showMsg('Enter your email and password.', 'err');

    submitBtn.disabled = true;
    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return showMsg(error.message, 'err');
        await continueAfterAuth(params);
      } else {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: `${location.origin}/login.html${location.search}` },
        });
        if (error) return showMsg(error.message, 'err');
        if (data.session) {
          await continueAfterAuth(params);
        } else {
          showMsg('Check your inbox to confirm your email, then sign in.', 'ok');
          setMode('signin');
        }
      }
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.getElementById('forgot-btn').addEventListener('click', async () => {
    if (!isConfigured) return;
    const email = emailEl.value.trim();
    if (!email) return showMsg('Enter your email above first, then click "Forgot password?".', 'err');
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${location.origin}/reset.html`,
    });
    if (error) return showMsg(error.message, 'err');
    showMsg('Password reset link sent — check your inbox.', 'ok');
  });
</script>

</body>
</html>
