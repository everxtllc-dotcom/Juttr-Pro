<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner offer — Juttr</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="theme-color" content="#0d1117" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('juttr-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<nav class="jx-nav">
  <a href="index.html" class="jx-logo"><img src="assets/logo.png" alt="Juttr logo" /> Juttr</a>
</nav>

<main class="jx-auth-main">
  <div class="jx-auth-card">
    <div class="jx-auth-logo"><img src="assets/logo.png" alt="" /> Juttr</div>
    <h1 class="jx-auth-title">Partner offer</h1>
    <p class="jx-auth-sub">Exclusive pricing for Juttr partners.</p>

    <div style="text-align:center; margin-bottom: 22px;">
      <span class="jx-plan-badge pro">Pro — Annual</span>
      <p style="font-size: 42px; font-weight: 800; letter-spacing: -0.03em; margin-top: 14px;">
        $19<span style="font-size: 16px; font-weight: 600; color: var(--text-secondary);"> / first year</span>
      </p>
      <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 4px;">
        billed annually · renews at $49 / year · cancel anytime
      </p>
    </div>

    <button class="jx-auth-submit" id="partner-btn" type="button">Get Pro — $19 first year</button>
    <p class="jx-auth-msg" id="partner-msg" role="alert" hidden></p>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script type="module">
  import { getSession, authedFetch } from './js/auth.js';

  const params = new URLSearchParams(location.search);
  const code = params.get('c') || '';
  const msg = document.getElementById('partner-msg');
  const btn = document.getElementById('partner-btn');

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = `jx-auth-msg ${kind}`;
    msg.hidden = false;
  }

  if (!code) {
    btn.disabled = true;
    showMsg('This offer requires a valid partner link.', 'err');
  }

  btn.addEventListener('click', async () => {
    const session = await getSession();
    if (!session) {
      // Sign in first, then come straight back into checkout.
      const next = encodeURIComponent(`partner.html?c=${code}`);
      location.href = `login.html?intent=upgrade&plan=influencer&c=${encodeURIComponent(code)}&next=${next}`;
      return;
    }
    btn.disabled = true;
    const { ok, status, data } = await authedFetch('/api/create-checkout', {
      plan: 'influencer',
      code,
    });
    btn.disabled = false;
    if (ok && data.url) { location.href = data.url; return; }
    if (status === 403) showMsg('This partner link is not valid.', 'err');
    else showMsg('Could not start checkout. Please try again.', 'err');
  });
</script>

</body>
</html>
