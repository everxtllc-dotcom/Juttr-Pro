<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Juttr</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="theme-color" content="#0d1117" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('juttr-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<nav class="jx-nav">
  <a href="index.html" class="jx-logo"><img src="assets/logo.png" alt="Juttr logo" /> Juttr</a>
</nav>

<main class="jx-auth-main">
  <div class="jx-auth-card">
    <h1 class="jx-auth-title">Set a new password</h1>
    <p class="jx-auth-sub">You arrived here from a password-reset email.</p>

    <form id="reset-form" novalidate>
      <div class="jx-auth-field">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
      </div>
      <div class="jx-auth-field">
        <label for="password2">Confirm new password</label>
        <input id="password2" type="password" autocomplete="new-password" required minlength="8" placeholder="Repeat the password" />
      </div>
      <button class="jx-auth-submit" id="reset-btn" type="submit">Update password</button>
    </form>

    <p class="jx-auth-msg" id="reset-msg" role="alert" hidden></p>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script type="module">
  import { supabase, isConfigured, getSession } from './js/auth.js';

  const msg = document.getElementById('reset-msg');
  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = `jx-auth-msg ${kind}`;
    msg.hidden = false;
  }

  if (!isConfigured) {
    showMsg('Accounts are not configured yet.', 'err');
  } else {
    // The recovery link signs the user in with a temporary session.
    getSession().then((session) => {
      if (!session) {
        showMsg('This reset link is invalid or has expired. Request a new one from the sign-in page.', 'err');
      }
    });
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!isConfigured) return;
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1.length < 8) return showMsg('Password must be at least 8 characters.', 'err');
    if (p1 !== p2) return showMsg('Passwords do not match.', 'err');

    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: p1 });
    btn.disabled = false;
    if (error) return showMsg(error.message, 'err');
    showMsg('Password updated — redirecting to your account…', 'ok');
    setTimeout(() => { location.href = 'account.html'; }, 1200);
  });
</script>

</body>
</html>
